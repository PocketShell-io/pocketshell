name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write

    steps:
      # Version code is the count of reachable release tags. Full history and
      # recursive submodules are required to build the real tagged APK from
      # the pinned JS core source.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # A direct `git push origin refs/tags/v...` bypasses
      # scripts/push-release-tag.sh. Re-check its publication boundary here
      # against a successful Actions release-validation run and that run's
      # trusted summary artifact; tag text and locally supplied summaries are
      # not evidence. The new JS rewrite cannot publish until its D36/D37
      # producers generate a matching successful summary.
      - name: Self-test exact-main tag publication guard
        run: scripts/check-tag-release-authorization.py --self-test

      - name: Authorize release tag against exact main validation
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: scripts/check-tag-release-authorization.py --release-tag "$RELEASE_TAG" --release-sha "$RELEASE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-js-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-js-

      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive package version from this tag
        id: version
        run: |
          scripts/derive-version.sh --self-test
          version_code="$(scripts/derive-version.sh version-code)"
          version_name="$(scripts/derive-version.sh version-name)"
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=${version_name}" >> "$GITHUB_OUTPUT"

      - name: Build web assets
        run: pnpm build:web

      - name: Sync Capacitor Android project
        run: pnpm cap:sync android

      - name: Assemble debug APK
        run: ./android/gradlew -p android assembleDebug --stacktrace --console=plain

      - name: Validate debug APK identity and signature
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          scripts/check-js-apk-metadata.py --self-test
          scripts/check-js-apk-metadata.py \
            --apk "$apk" \
            --variant debug \
            --expected-version-code "$VERSION_CODE" \
            --expected-version-name "$VERSION_NAME"
          scripts/check-apk-signing.sh --variant debug --js-first --apk "$apk"

      - name: Rename debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/pocketshell-${VERSION_NAME}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketshell-${{ steps.version.outputs.name }}-debug.apk
          path: android/app/build/outputs/apk/debug/pocketshell-${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error

      # Release packaging refuses to fall back to the debug key. The same
      # four signing secrets used by the established release identity feed
      # the generated Capacitor Gradle project.
      - name: Assemble signed release APK
        run: ./android/gradlew -p android assembleRelease --stacktrace --console=plain
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Validate release APK identity and signature
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          scripts/check-js-apk-metadata.py \
            --apk "$apk" \
            --variant release \
            --expected-version-code "$VERSION_CODE" \
            --expected-version-name "$VERSION_NAME"
          scripts/check-apk-signing.sh --variant release --apk "$apk"

      - name: Rename release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/pocketshell-${VERSION_NAME}-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketshell-${{ steps.version.outputs.name }}-release.apk
          path: android/app/build/outputs/apk/release/pocketshell-${{ steps.version.outputs.name }}-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/debug/pocketshell-${{ steps.version.outputs.name }}-debug.apk
            android/app/build/outputs/apk/release/pocketshell-${{ steps.version.outputs.name }}-release.apk
          generate_release_notes: true
