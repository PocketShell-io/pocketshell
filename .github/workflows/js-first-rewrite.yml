name: JS-first rewrite

on:
  push:
    branches: [rewrite/js-first-0.6.0]
  pull_request:
    branches: [rewrite/js-first-0.6.0]

concurrency:
  group: js-first-rewrite-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  web-and-android:
    name: JS checks and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with pinned core source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # versionCode is derived from reachable release tags; a shallow
          # checkout would build the placeholder version while the APK still
          # appeared internally consistent.
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install screenshot OCR for packaged lifecycle evidence
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y imagemagick tesseract-ocr

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check exact JavaScript unit gate
        run: |
          scripts/check-js-unit-results.py --self-test
          scripts/run-js-unit-gate.sh

      - name: Check fail-closed feature journey qualification guard
        run: scripts/check-js-journey-results.py --self-test

      - name: Check fail-closed packaged lifecycle result guard
        run: scripts/check-js-lifecycle-results.py --self-test

      - name: Check fail-closed packaged fast-key result guard
        run: scripts/check-js-hotkeys-journey-results.py --self-test

      - name: Check JS-first connected-test dispatch and lock contracts
        run: |
          tests/scripts/connected-test-js-runner-test.sh
          tests/scripts/connected-test-root-guard-test.sh
          tests/scripts/js-first-rewrite-composer-gate-test.sh
          tests/scripts/js-first-rewrite-hotkeys-gate-test.sh

      - name: Build Android debug APK
        run: pnpm build:android:debug

      - name: Validate packaged Android identity and derived version
        run: |
          scripts/check-js-apk-metadata.py --self-test
          scripts/derive-version.sh --self-test
          version_code="$(scripts/derive-version.sh version-code)"
          version_name="$(scripts/derive-version.sh version-name)"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          scripts/check-js-apk-metadata.py \
            --apk "$apk" \
            --variant debug \
            --expected-version-code "$version_code" \
            --expected-version-name "$version_name"
          scripts/check-apk-signing.sh --variant debug --js-first --apk "$apk"

      - name: Prepare packaged JS smoke APKs
        run: scripts/connected-js-smoke.sh --suffix i2855ci --prepare-only

      - name: Start version-matched Docker agents fixture
        run: |
          source scripts/lib/agents-fixture-version.sh
          export_agents_fixture_version_for_run 0 android/app/build/outputs/apk/debug/app-debug.apk
          scripts/ci-journey-fixture-retry.sh agents -- docker compose -f tests/docker/docker-compose.yml up -d --build --no-deps agents
          source tests/docker/lib/wait-for-healthy.sh
          wait_for_container_healthy tests/docker/docker-compose.yml agents /tmp/js-lifecycle-agents-health.log 60
          cat /tmp/js-lifecycle-agents-health.log

      - name: Start isolated Docker agents lane for the composer journey
        run: scripts/agents-pool.sh up 2245

      - name: Start isolated Docker agents lane for the mobile fast-key journey
        run: scripts/agents-pool.sh up 2243

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for API 35 emulator
        run: scripts/ci-emulator-free-disk.sh

      - name: Capture and verify emulator JS runtime after disk cleanup
        id: emulator-js-runtime
        shell: bash
        run: |
          node_path="$(command -v node)"
          pnpm_path="$(command -v pnpm)"
          [[ "$node_path" == /* && -x "$node_path" ]] || { echo 'FAIL: node is unavailable after disk cleanup' >&2; exit 1; }
          [[ "$pnpm_path" == /* && -x "$pnpm_path" ]] || { echo 'FAIL: pnpm is unavailable after disk cleanup' >&2; exit 1; }
          "$node_path" --version
          "$pnpm_path" --version
          printf 'path=%s\n' "$PATH" >> "$GITHUB_OUTPUT"
          printf 'pnpm=%s\n' "$pnpm_path" >> "$GITHUB_OUTPUT"

      - name: Repair Android cmdline-tools and accept licenses
        run: scripts/ci-emulator-repair-sdk-tools.sh

      - name: Check emulator action pin
        run: scripts/check-emulator-action-pin.sh

      - name: Run packaged JS smoke suite on API 35
        id: packaged-smoke
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          PATH: ${{ steps.emulator-js-runtime.outputs.path }}
          PNPM: ${{ steps.emulator-js-runtime.outputs.pnpm }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -memory 6144 -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: scripts/ci-js-first-packaged-lanes.sh

      - name: Assert the packaged JS composer journey executed exactly once
        if: always()
        run: |
          scripts/check-js-composer-journey-results.py --self-test
          scripts/check-js-composer-journey-results.py \
            --results-dir android/app/build/outputs/js-composer-results

      - name: Assert the packaged JS mobile fast-key journey executed exactly once
        if: always()
        run: |
          scripts/check-js-hotkeys-journey-results.py --self-test
          scripts/check-js-hotkeys-journey-results.py \
            --results-dir android/app/build/outputs/js-hotkeys

      - name: Collect isolated composer fixture diagnostics
        if: always()
        run: |
          mkdir -p android/app/build/outputs/js-composer/ci-fixture
          docker inspect pocketshell-test-agents-2245 \
            > android/app/build/outputs/js-composer/ci-fixture/agents-inspect.json 2>&1 || true
          docker logs pocketshell-test-agents-2245 \
            > android/app/build/outputs/js-composer/ci-fixture/agents.log 2>&1 || true

      - name: Collect isolated fast-key fixture diagnostics
        if: always()
        run: |
          mkdir -p android/app/build/outputs/js-hotkeys/ci-fixture
          docker inspect pocketshell-test-agents-2243 \
            > android/app/build/outputs/js-hotkeys/ci-fixture/agents-inspect.json 2>&1 || true
          docker logs pocketshell-test-agents-2243 \
            > android/app/build/outputs/js-hotkeys/ci-fixture/agents.log 2>&1 || true

      - name: Upload packaged JS composer run evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocketshell-js-first-composer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/js-composer/
            android/app/build/outputs/js-composer-results/TEST-*.xml
          if-no-files-found: error

      - name: Upload packaged JS fast-key run evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocketshell-js-first-hotkeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/js-hotkeys/
          if-no-files-found: error

      - name: Stop isolated composer Docker agents lane
        if: always()
        run: scripts/agents-pool.sh down 2243 2245

      - name: Upload packaged APK and connected smoke results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocketshell-js-first-debug-smoke
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/androidTest-results/connected/debug/TEST-*.xml
            android/app/build/outputs/js-smoke-results/TEST-*.xml
            android/app/build/outputs/androidTest-results/connected/debug/diagnostics-*
            android/app/build/outputs/js-lifecycle/**
          if-no-files-found: warn

  docker-agents-fixture:
    name: Docker agents fixture contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Exercise pinned CLI/aplexer fixture
        run: scripts/test-agents-fixture-aplexer.sh --docker
