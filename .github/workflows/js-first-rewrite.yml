name: JS-first rewrite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: js-first-rewrite-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  web-and-android:
    name: JS checks and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with pinned core source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # versionCode is derived from reachable release tags; a shallow
          # checkout would build the placeholder version while the APK still
          # appeared internally consistent.
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install screenshot OCR for packaged lifecycle evidence
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y imagemagick tesseract-ocr

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check exact JavaScript unit gate
        run: |
          scripts/check-js-unit-results.py --self-test
          scripts/run-js-unit-gate.sh

      - name: Check CI watcher required-check defaults
        run: python3 scripts/watch-ci.py --self-test

      - name: Check fail-closed feature journey qualification guard
        run: scripts/check-js-journey-results.py --self-test

      - name: Check fail-closed packaged lifecycle result guard
        run: scripts/check-js-lifecycle-results.py --self-test

      - name: Check Android input-focus failure diagnostics guard
        run: scripts/check-android-input-diagnostics.py --self-test

      - name: Check fail-closed packaged usage and ports result guards
        run: |
          scripts/check-js-usage-ports-results.py --self-test
          scripts/check-js-usage-ports-host-evidence.py --self-test

      - name: Check fail-closed packaged Files result guard
        run: scripts/check-js-files-results.py --self-test

      - name: Check JS Android journey dispatch guard
        run: |
          scripts/check-test-validity.sh --j1-only --self-test
          scripts/check-test-validity.sh --j1-only

      - name: Check JS-first connected-test dispatch and lock contracts
        run: |
          tests/scripts/connected-test-js-runner-test.sh
          tests/scripts/android-input-preflight-test.sh
          tests/scripts/connected-test-root-guard-test.sh
          tests/scripts/connected-test-serial-ownership-test.sh
          tests/scripts/avd-lock-test.sh
          tests/scripts/avd-lock-sharing-test.sh
          scripts/test-gradle-output-lock.sh
          tests/scripts/js-first-rewrite-composer-gate-test.sh

      - name: Build Android debug APK
        run: pnpm build:android:debug

      # Issue #2856: run after the debug APK step above has generated the
      # ignored Capacitor Gradle inputs; validate fresh results from all four
      # production close paths in this required JS-first check.
      - name: Run native SSH close-accounting unit regression (issue #2856)
        shell: bash
        run: |
          set -euo pipefail
          touch "${RUNNER_TEMP}/ssh-close-unit-start"
          set -o pipefail
          android/gradlew -p android :app:testDebugUnitTest \
            --tests com.pocketshell.app.SshCapabilityPluginCloseTest \
            --rerun-tasks --no-build-cache --no-daemon --stacktrace --console=plain \
            2>&1 | tee "${RUNNER_TEMP}/ssh-close-unit-gradle.log"
          python3 - "${RUNNER_TEMP}/ssh-close-unit-start" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path("android/app/build/test-results/testDebugUnitTest/TEST-com.pocketshell.app.SshCapabilityPluginCloseTest.xml")
          marker = Path(sys.argv[1])
          if not report.is_file():
              raise SystemExit(f"FAIL: missing close-accounting JUnit report: {report}")
          if report.stat().st_mtime_ns <= marker.stat().st_mtime_ns:
              raise SystemExit("FAIL: close-accounting JUnit report predates this run")
          root = ET.parse(report).getroot()
          cases = root.findall("testcase")
          if not cases or int(root.attrib.get("tests", "0")) != len(cases):
              raise SystemExit("FAIL: close-accounting report declares no tests or disagrees with testcase rows")
          if int(root.attrib.get("skipped", "0")) != 0 or int(root.attrib.get("failures", "0")) != 0 or int(root.attrib.get("errors", "0")) != 0:
              raise SystemExit("FAIL: close-accounting class has skipped, failed, or errored tests")
          names = {case.attrib.get("name") for case in cases}
          required = {
              "actualConnectionCloseKeepsSnapshotEntryUntilNativeSocketCloses",
              "productionPtyCloseKeepsSnapshotEntryUntilNativeChannelCloses",
              "productionSftpCloseKeepsSnapshotEntryUntilNativeClientCloses",
              "productionForwardCloseKeepsSnapshotEntryUntilNativeListenerCloses",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"FAIL: required production-path regressions did not execute: {missing}")
          print(f"PASS: {len(cases)} close-accounting tests executed; connection, PTY, SFTP, and forward regressions present")
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      - name: Validate packaged Android identity and derived version
        run: |
          scripts/check-js-apk-metadata.py --self-test
          scripts/derive-version.sh --self-test
          version_code="$(scripts/derive-version.sh version-code)"
          version_name="$(scripts/derive-version.sh version-name)"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          scripts/check-js-apk-metadata.py \
            --apk "$apk" \
            --variant debug \
            --expected-version-code "$version_code" \
            --expected-version-name "$version_name"
          scripts/check-apk-signing.sh --variant debug --js-first --apk "$apk"

      - name: Prepare packaged JS smoke APKs
        run: |
          scripts/connected-js-smoke.sh --suffix i2855ci --prepare-only
          scripts/connected-js-files-docker.sh --suffix i2858ci --prepare-only

      - name: Start version-matched Docker agents fixture
        run: |
          source scripts/lib/agents-fixture-version.sh
          export_agents_fixture_version_for_run 0 android/app/build/outputs/apk/debug/app-debug.apk
          scripts/ci-journey-fixture-retry.sh agents -- docker compose -f tests/docker/docker-compose.yml up -d --build --no-deps agents
          source tests/docker/lib/wait-for-healthy.sh
          wait_for_container_healthy tests/docker/docker-compose.yml agents /tmp/js-lifecycle-agents-health.log 60
          cat /tmp/js-lifecycle-agents-health.log

      - name: Start isolated Docker agents lane for the composer journey
        run: scripts/agents-pool.sh up 2245

      - name: Start isolated Docker agents lane for the shared-app journey
        run: scripts/agents-pool.sh up 2244

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for API 35 emulator
        run: scripts/ci-emulator-free-disk.sh

      - name: Capture and verify emulator JS runtime after disk cleanup
        id: emulator-js-runtime
        shell: bash
        run: |
          node_path="$(command -v node)"
          pnpm_path="$(command -v pnpm)"
          [[ "$node_path" == /* && -x "$node_path" ]] || { echo 'FAIL: node is unavailable after disk cleanup' >&2; exit 1; }
          [[ "$pnpm_path" == /* && -x "$pnpm_path" ]] || { echo 'FAIL: pnpm is unavailable after disk cleanup' >&2; exit 1; }
          "$node_path" --version
          "$pnpm_path" --version
          printf 'path=%s\n' "$PATH" >> "$GITHUB_OUTPUT"
          printf 'pnpm=%s\n' "$pnpm_path" >> "$GITHUB_OUTPUT"

      - name: Repair Android cmdline-tools and accept licenses
        run: scripts/ci-emulator-repair-sdk-tools.sh

      - name: Check emulator action pin
        run: scripts/check-emulator-action-pin.sh

      - name: Run packaged JS journeys on API 35
        id: packaged-smoke
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          PATH: ${{ steps.emulator-js-runtime.outputs.path }}
          PNPM: ${{ steps.emulator-js-runtime.outputs.pnpm }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -memory 6144 -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: scripts/ci-js-first-packaged-lanes.sh

      - name: Require exact reports for every packaged JS lane
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          run_check() {
            local lane="$1"
            shift
            if "$@"; then
              return 0
            else
              local status=$?
              printf 'FAIL: %s result check exited %s\n' "$lane" "$status" >&2
              failed=1
            fi
          }

          run_check smoke scripts/check-js-smoke-results.py \
            --results-dir android/app/build/outputs/js-smoke-results
          run_check lifecycle scripts/check-js-lifecycle-results.py \
            --results-dir "android/app/build/outputs/js-lifecycle/js2861-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/instrumentation-results"
          run_check Files scripts/check-js-files-results.py \
            --results-dir "android/app/build/outputs/js-files/js2858-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/instrumentation-results"
          run_check Usage/Ports scripts/check-js-usage-ports-results.py \
            --results-dir "android/app/build/outputs/js-usage-ports/js2859-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/instrumentation-results"
          run_check "Shared app" scripts/check-js-shared-app-results.py \
            --results-dir android/app/build/outputs/js-shared-app-results

          composer_root="android/app/build/outputs/js-composer"
          composer_prefix="js2891-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"
          shopt -s nullglob
          composer_runs=("$composer_root/$composer_prefix"*)
          if (( ${#composer_runs[@]} == 1 )); then
            composer_run="${composer_runs[0]}"
            run_check "Composer prepare" scripts/check-js-composer-journey-results.py \
              --results-dir "$composer_run/phase-prepare"
            run_check "Composer resume" scripts/check-js-composer-journey-results.py \
              --results-dir "$composer_run/phase-resume"
          else
            printf 'FAIL: expected exactly one Composer report directory for prefix %s; found %s\n' \
              "$composer_prefix" "${#composer_runs[@]}" >&2
            failed=1
          fi

          if (( failed != 0 )); then
            exit 1
          fi

      - name: Collect isolated composer fixture diagnostics
        if: always()
        run: |
          mkdir -p android/app/build/outputs/js-composer/ci-fixture
          docker inspect pocketshell-test-agents-2245 \
            > android/app/build/outputs/js-composer/ci-fixture/agents-inspect.json 2>&1 || true
          docker logs pocketshell-test-agents-2245 \
            > android/app/build/outputs/js-composer/ci-fixture/agents.log 2>&1 || true

      - name: Upload packaged JS composer run evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocketshell-js-first-composer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/js-composer/
            android/app/build/outputs/androidTest-results/connected/debug/TEST-*.xml
          if-no-files-found: error

      - name: Stop isolated composer Docker agents lane
        if: always()
        run: scripts/agents-pool.sh down 2245

      - name: Stop isolated shared-app Docker agents lane
        if: always()
        run: scripts/agents-pool.sh down 2244

      - name: Upload packaged APK and connected journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pocketshell-js-first-packaged-journeys
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/androidTest-results/connected/debug/TEST-*.xml
            android/app/build/outputs/js-smoke-results/TEST-*.xml
            android/app/build/outputs/js-smoke-diagnostics/**
            android/app/build/outputs/js-usage-ports/**
            android/app/build/outputs/androidTest-results/connected/debug/diagnostics-*
            android/app/build/outputs/js-lifecycle/**
            android/app/build/outputs/js-files/**
          if-no-files-found: warn

      - name: Stop Docker agents fixture
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down --volumes --remove-orphans

  docker-agents-fixture:
    name: Docker agents fixture contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Exercise pinned CLI/aplexer fixture
        run: scripts/test-agents-fixture-aplexer.sh --docker
