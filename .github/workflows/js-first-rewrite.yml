name: JS-first rewrite

on:
  push:
    branches: [rewrite/js-first-0.6.0]
  pull_request:
    branches: [rewrite/js-first-0.6.0]

concurrency:
  group: js-first-rewrite-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  web-and-android:
    name: JS checks and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with pinned core source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build Android debug APK
        run: pnpm build:android:debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: pocketshell-js-first-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  docker-agents-fixture:
    name: Docker agents fixture contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Exercise pinned CLI/aplexer fixture
        run: scripts/test-agents-fixture-aplexer.sh --docker
