name: app2

# Rewrite task M-2 — CI lanes for the modules the rewrite adds.
#
# The rewrite (docs/_scratch/simplification-implementation-plan-2026-09-02.md)
# hard-cut the old `app/`, `core-ssh`, `core-tmux`, `core-connection` and
# `core-agents` modules on the `stable` branch and grew three new ones:
# `shared/core-hostapi` (pure JVM host-CLI wire contract), `shared/core-transport`
# (the one module that knows sshj) and `app2` (the new application module).
# None of them had a CI lane. This workflow is that lane.
#
# Task P-4 un-shelved `shared/core-portfwd` (the port-forwarding tunnel engine,
# rewired from the deleted core-ssh onto core-transport) and added its two lanes
# here, unit + Docker, for the same reason: a module in settings.gradle.kts that
# no gate runs is a module whose regression tests do not exist.
#
# DELIBERATELY A SEPARATE FILE FROM tests.yml
#   * tests.yml still describes the OLD module graph (it runs
#     `:app:integrationTest :shared:core-ssh:integrationTest
#     :shared:core-tmux:integrationTest`, none of which exist on this branch any
#     more) and needs its own cleanup pass. Adding the new modules to it would entangle the two.
#   * tests.yml is under a hard file-size ratchet
#     (scripts/check-file-size-hygiene.sh) with very little headroom — the same
#     reason full-suite-notify.yml (#2353) was
#     were split out.
#
# NOT A REQUIRED CHECK (#2354). Do not register these jobs as required
# branch-protection checks. Trigger-level `paths:` / `paths-ignore` were
# removed (issue #2509): GitHub's `on.push.paths` is the #2354 footgun
# (non-matching PRs never start a run, required contexts sit at Expected
# forever) AND empirically suppressed this file's `schedule:` cadence —
# `gh run list --workflow app2.yml --event schedule` stayed empty while
# tests.yml's schedule the same morning fired. Per-job selection stays in
# the `changes` job (empty/unknown base → ALL lanes, which is what
# schedule/dispatch pass). A skipped-but-present job is the honest signal;
# a workflow GitHub never started is not.
#
# TWO LAYERS OF androidTest PROTECTION.
#   * `app2-unit` COMPILES the androidTest source set on every run — cheap, no
#     emulator — so a journey cannot silently rot against a main-source change
#     (the old module learned this the expensive way: the required Unit job
#     never compiled `androidTest`, so a signature break there surfaced only
#     after merge and took out every connected gate at once — see process.md,
#     "Local Confidence Before CI").
#   * `app2-journey` (issue #2474) actually RUNS the whole set — J01-J08,
#     J10-J12 — on an emulator against the Docker `agents` +
#     `network-fault-proxy` fixtures. Batched on push/dispatch, never per-PR;
#     that job's own header carries the one-unfiltered-run and no-`needs:`
#     decisions.

on:
  # No workflow-level `paths:` / `paths-ignore` (issue #2509 / D37). GitHub's
  # own filter decides whether the WHOLE run happens; pinning it here is how
  # the scheduled cadence silently never started. Per-JOB selection is the
  # `changes` job's business, and it already fail-opens on empty/unknown base.
  push:
    branches:
      - main
      - stable
  pull_request:
    # The rewrite branch has its own JS/Capacitor gate. Keep the D36/D37
    # app2 lanes attached only to the existing Android branches until #2863
    # proves the replacement gates before any main-branch handoff.
    branches:
      - main
      - stable
  workflow_dispatch:
  # NIGHTLY CADENCE (decision D37). D37 requires the fault/journey release gate
  # to run on a scheduled cadence with no off switch; it used to be satisfied by
  # .github/workflows/nightly-extensive.yml, which the rewrite deleted along with
  # the `:app` module every one of its five Gradle invocations targeted. This
  # lane is that gate's successor, so it takes the cadence too — 02:17 UTC, the
  # slot the old nightly held, kept rather than moved so the off-hours window is
  # unchanged. The `changes` job's selector fail-opens on a non-push event (no
  # diff base -> ALL lanes), so a scheduled/dispatched run exercises the whole
  # suite rather than whatever a diff picked.
  schedule:
    - cron: "17 2 * * *"

concurrency:
  # A scheduled run gets its OWN group and is never cancelled. Without this it
  # would share `ref-refs/heads/main` with pushes, and the nightly would queue
  # behind (historically, pre-#2736: be cancelled by) ordinary pushes — a
  # cadence that silently does not run is exactly the D37 bypass this cron
  # exists to close, and it would look green (cancelled, not failed) while
  # doing it. Same split tests.yml already uses for its own schedule.
  #
  # Issue #2593 (decision D40), corrected by issue #2736: NOTHING in these
  # groups is ever cancelled — neither a running run nor a queued one.
  # Cancelling a superseded push run does not just drop redundant work — it
  # drops that commit's ONLY validation: the next push's lane selector diffs
  # against `github.event.before`, whose TREE already contains the dropped
  # commit's changes, so those changes are selected by no run ever after
  # (2adafd86d's app2 changes reached main with zero journey execution, read
  # green, and were covered only by an unrelated later fail-open).
  #
  # D40's original shape — `cancel-in-progress` false for pushes — protected
  # only RUNNING runs. GitHub's default concurrency ALSO cancels a group's
  # PENDING (queued, never-started) run the moment a newer run joins the
  # group, regardless of `cancel-in-progress`: on 2026-09-16 five never-started
  # main runs were collapsed within 0-8s of the next run's creation, each with
  # `"jobs":[]` (#2736) — during a busy merge window EVERY queued run was
  # collapsed before it started, so merges read green with zero journey
  # execution: the exact hazard D40 exists to prevent. `queue: max` (GitHub,
  # 2026-05-07) is the opt-out: up to 100 runs may wait PENDING in the group
  # and are dispatched first-in-first-out as each finishes, so a queued run is
  # a delayed validation, never a lost one. Dispatch joins the push/ref group
  # and queues with it (the 2026-09-06 pitfall shape).
  #
  # `cancel-in-progress` is therefore GONE, not merely false: GitHub rejects
  # `queue: max` + `cancel-in-progress: true` as a workflow validation error,
  # so the PR-only conditional cannot stay. Consequence (accepted, and the
  # same trade D40 already made for main): PR heads now QUEUE serially in
  # their per-PR group instead of superseding each other — the final head's
  # result arrives later; nothing is validated less.
  # scripts/check-nightly-workflow.sh pins this shape (queue: max present,
  # cancel-in-progress unset or literal false) and reddens on a revert to
  # either the pre-D40 or the D40 form.
  #
  # RESIDUAL EXPOSURE, audited in #2706: none of the above stops an OUT-OF-BAND
  # run-level cancellation — a manual or API cancel of the whole run kills
  # every job in it, and GitHub has no workflow-level opt-out (job-level
  # `if: !cancelled()` guards only job-dependency cancels). That is what killed
  # this lane's fault-verdict job on release/v0.5.4 (run 34402741674: cancelled
  # ~8.5 min after an unrelated portfwd Docker-lane failure in the same run).
  # The consumer side carries the isolation instead:
  # scripts/check-nightly-fault-run.sh treats a cancelled journey job as a
  # verdict GAP — it walks back to the newest run with a real terminal verdict
  # (so a verdict-less cancel cannot erase a covering green) and prints a NOTE
  # per skipped run; only `success` on a run covering the release HEAD passes.
  group: ${{ github.event_name == 'schedule' && format('{0}-sched', github.workflow) || format('{0}-{1}', github.workflow, github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref)) }}
  queue: max

permissions:
  contents: read

jobs:
  # Per-JOB path filtering. scripts/ci-app2-changed-modules.sh carries the
  # logic (and its own self-test) so the "never under-select" property is
  # exercised rather than living in an untested YAML expression. Every
  # uncertain case — unknown base, unreadable diff, workflow_dispatch, a change
  # to shared build infrastructure — fails OPEN and selects all four lanes.
  changes:
    name: Select lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hostapi: ${{ steps.select.outputs.hostapi }}
      transport: ${{ steps.select.outputs.transport }}
      portfwd: ${{ steps.select.outputs.portfwd }}
      app2: ${{ steps.select.outputs.app2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The diff base must be present in the clone, so no shallow fetch.
          fetch-depth: 0

      - name: Self-test the lane selector
        run: |
          chmod +x scripts/ci-app2-changed-modules.sh
          scripts/ci-app2-changed-modules.sh --self-test

      # Issue #2474: wired HERE, in the cheap always-runs job, not inside the
      # emulator job it belongs to — the journey lane is skipped on PRs, so a
      # self-test living there would only ever run on the push that already
      # broke `stable`. It needs no JDK, no Docker and no emulator.
      - name: Self-test the app2 journey runner
        run: |
          chmod +x scripts/ci-app2-journey-suite.sh
          scripts/ci-app2-journey-suite.sh --self-test

      - name: Select lanes
        id: select
        run: |
          scripts/ci-app2-changed-modules.sh \
            --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}"

      # Issue #2600: the run's conclusion answers only "were the SELECTED lanes
      # green" — a docs-only push reports success with every heavy lane
      # skipped, and from the conclusion alone that is indistinguishable from a
      # run that validated them. Publish the selection to the run summary (what
      # an on-call reads first) and raise an annotation whenever the journey
      # lane is skipped, so a skipped lane cannot masquerade as validation.
      # workflow_dispatch and schedule fail open to ALL lanes, so the banner
      # only ever fires where the skip is a real selection decision.
      - name: Publish the lane plan to the run summary (#2600)
        if: always()
        run: |
          {
            echo "## Lane plan for this run"
            echo
            echo "Event: \`${{ github.event_name }}\`. A skipped lane means this run says NOTHING about it — the run's conclusion is not evidence for that lane."
            echo
            echo "| Lane | Selection |"
            echo "|---|---|"
            echo "| core-hostapi unit | ${{ steps.select.outputs.hostapi == 'true' && 'RUNS' || 'skipped' }} |"
            echo "| core-transport unit | ${{ steps.select.outputs.transport == 'true' && 'RUNS' || 'skipped' }} |"
            echo "| core-transport integration (Docker) | ${{ steps.select.outputs.transport == 'true' && 'RUNS' || 'skipped' }} |"
            echo "| core-portfwd unit | ${{ steps.select.outputs.portfwd == 'true' && 'RUNS' || 'skipped' }} |"
            echo "| core-portfwd integration (Docker) | ${{ steps.select.outputs.portfwd == 'true' && 'RUNS' || 'skipped' }} |"
            echo "| app2 unit | ${{ steps.select.outputs.app2 == 'true' && 'RUNS' || 'skipped' }} |"
            echo "| app2 journey (emulator) | ${{ steps.select.outputs.app2 == 'true' && 'RUNS' || 'skipped' }} |"
            echo "| shared/ui-kit connected (emulator) | ${{ steps.select.outputs.app2 == 'true' && 'RUNS' || 'skipped' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${{ steps.select.outputs.app2 }}" != "true" ]; then
            {
              echo
              echo "> ⚠️ **The app2 journey and shared/ui-kit connected lanes are skipped on this run. This run is NOT validation of the journeys or of the ui-kit connected suite.**"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning title=Emulator lanes skipped::The app2 journey and shared/ui-kit connected lanes are skipped on this run — its conclusion is not validation of either (#2600, #2826)"
          fi

  # ---------------------------------------------------------------------------
  # shared/core-hostapi — pure JVM (kotlin("jvm")), no Android SDK, no
  # Robolectric. `test` is the single Java-plugin test task; there is no
  # Debug/Release split to shard.
  hostapi-test:
    name: core-hostapi unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.hostapi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Mark test-run start
        run: touch "${RUNNER_TEMP}/hostapi-run-start"

      # --rerun-tasks --no-build-cache is not belt-and-braces: a plain
      # `:shared:core-hostapi:test` came back FROM-CACHE in 1s, zero tests
      # executed, while this lane was being written.
      - name: Run core-hostapi unit tests
        id: hostapi_tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew :shared:core-hostapi:test \
            --rerun-tasks --no-build-cache \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee "${RUNNER_TEMP}/hostapi-gradle.log"

      # Floors are set a little under the count observed when the lane landed
      # (28) so ordinary churn does not trip them but a mass loss of tests does.
      - name: Assert tests actually executed
        if: always() && steps.hostapi_tests.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-app2-lane-execution.py
          scripts/check-app2-lane-execution.py --self-test
          scripts/check-app2-lane-execution.py \
            --label ":shared:core-hostapi:test" \
            --results-dir shared/core-hostapi/build/test-results/test \
            --min 20 \
            --newer-than "${RUNNER_TEMP}/hostapi-run-start"

      - name: Upload core-hostapi test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app2-hostapi-test-reports
          path: |
            shared/core-hostapi/build/reports/tests/
            shared/core-hostapi/build/test-results/
          overwrite: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # shared/core-transport — Android library. `:test` is AGP's variant-spanning
  # alias, so BOTH testDebugUnitTest and testReleaseUnitTest run and both result
  # dirs are checked. The Testcontainers *IntegrationTest classes are excluded
  # from these tasks by the module's build script; they run in the Docker lane
  # below.
  transport-test:
    name: core-transport unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.transport == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Mark test-run start
        run: touch "${RUNNER_TEMP}/transport-run-start"

      - name: Run core-transport unit tests
        id: transport_tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./gradlew :shared:core-transport:test \
            --rerun-tasks --no-build-cache \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee "${RUNNER_TEMP}/transport-gradle.log"

      # 38 observed when the lane landed (19 per variant); floor 30.
      - name: Assert tests actually executed
        if: always() && steps.transport_tests.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-app2-lane-execution.py
          scripts/check-app2-lane-execution.py --self-test
          scripts/check-app2-lane-execution.py \
            --label ":shared:core-transport:test" \
            --results-dir shared/core-transport/build/test-results/testDebugUnitTest \
            --results-dir shared/core-transport/build/test-results/testReleaseUnitTest \
            --min 30 \
            --newer-than "${RUNNER_TEMP}/transport-run-start"

      - name: Upload core-transport unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app2-transport-test-reports
          path: |
            shared/core-transport/build/reports/tests/
            shared/core-transport/build/test-results/
          overwrite: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # shared/core-transport Docker lane. Service-startup shape copied from
  # tests.yml's `integration` job: JDK 17 + Gradle cache + `docker info` before
  # handing off to Testcontainers, then a fresh-run marker, --rerun-tasks
  # --no-build-cache, an execution guard, and an always-on report upload.
  #
  # tests.yml's separate agents-fixture lifecycle smoke is deliberately not
  # copied: this lane's Testcontainers suite builds its own SSH image.
  # RealHostConnectionIntegrationTest uses
  # none of them — Testcontainers builds its own sshd image from
  # tests/docker/Dockerfile.ssh — so those steps would add several minutes of
  # unrelated image builds and a failure mode this lane cannot cause.
  #
  # The suite skips itself via `assumeTrue` when Docker is unreachable, which
  # would be a green run of 8 SKIPPED tests. The execution guard counts
  # executed = tests - skipped, so that shape fails here instead of passing.
  transport-integration:
    name: core-transport integration tests (Docker)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.transport == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ubuntu-latest runners have Docker preinstalled and the daemon running,
      # which is what Testcontainers needs. Sanity-check before we hand off.
      - name: Verify Docker is available
        run: docker info

      - name: Mark integration-run start
        run: touch "${RUNNER_TEMP}/transport-integration-run-start"

      - name: Run core-transport integration tests
        id: transport_integration
        timeout-minutes: 35
        run: |
          set -o pipefail
          ./gradlew :shared:core-transport:integrationTest \
            --rerun-tasks --no-build-cache \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee "${RUNNER_TEMP}/transport-integration-gradle.log"

      # 8 observed when the lane landed; floor 6.
      - name: Assert integration tests actually executed
        if: always() && steps.transport_integration.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-app2-lane-execution.py
          scripts/check-app2-lane-execution.py --self-test
          scripts/check-app2-lane-execution.py \
            --label ":shared:core-transport:integrationTest" \
            --results-dir shared/core-transport/build/test-results/integrationTest \
            --min 6 \
            --newer-than "${RUNNER_TEMP}/transport-integration-run-start"

      - name: Upload core-transport integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app2-transport-integration-reports
          path: |
            shared/core-transport/build/reports/tests/
            shared/core-transport/build/test-results/
          overwrite: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # shared/core-portfwd — the port-forwarding tunnel engine (task P-4).
  # Android library like core-transport, so `:test` is AGP's variant-spanning
  # alias and BOTH result dirs are checked. The Testcontainers *IntegrationTest
  # classes are excluded from these tasks by the module's build script; they run
  # in the Docker lane below.
  portfwd-test:
    name: core-portfwd unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.portfwd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Mark test-run start
        run: touch "${RUNNER_TEMP}/portfwd-run-start"

      - name: Run core-portfwd unit tests
        id: portfwd_tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./gradlew :shared:core-portfwd:test \
            --rerun-tasks --no-build-cache \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee "${RUNNER_TEMP}/portfwd-gradle.log"

      # 108 observed when the lane landed (54 per variant); floor 80.
      - name: Assert tests actually executed
        if: always() && steps.portfwd_tests.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-app2-lane-execution.py
          scripts/check-app2-lane-execution.py --self-test
          scripts/check-app2-lane-execution.py \
            --label ":shared:core-portfwd:test" \
            --results-dir shared/core-portfwd/build/test-results/testDebugUnitTest \
            --results-dir shared/core-portfwd/build/test-results/testReleaseUnitTest \
            --min 80 \
            --newer-than "${RUNNER_TEMP}/portfwd-run-start"

      - name: Upload core-portfwd unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app2-portfwd-test-reports
          path: |
            shared/core-portfwd/build/reports/tests/
            shared/core-portfwd/build/test-results/
          overwrite: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # shared/core-portfwd Docker lane (task P-4). Same shape as the transport
  # Docker lane: Testcontainers builds its own sshd image from
  # tests/docker/Dockerfile.ssh, so none of tests.yml's compose fixtures are
  # needed. This is the lane that proves a REAL forward carries bytes — the
  # suite dials the container, opens `-L`, reads the sshd banner back through
  # the tunnel, and re-establishes a manual forward after a real drop.
  #
  # The suite skips itself via `assumeTrue` when Docker is unreachable, which
  # would be a green run of 6 SKIPPED tests. The execution guard counts
  # executed = tests - skipped, so that shape fails here instead of certifying
  # nothing.
  portfwd-integration:
    name: core-portfwd integration tests (Docker)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.portfwd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify Docker is available
        run: docker info

      - name: Mark integration-run start
        run: touch "${RUNNER_TEMP}/portfwd-integration-run-start"

      - name: Run core-portfwd integration tests
        id: portfwd_integration
        timeout-minutes: 35
        run: |
          set -o pipefail
          ./gradlew :shared:core-portfwd:integrationTest \
            --rerun-tasks --no-build-cache \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee "${RUNNER_TEMP}/portfwd-integration-gradle.log"

      # 6 observed when the lane landed; floor 5.
      - name: Assert integration tests actually executed
        if: always() && steps.portfwd_integration.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-app2-lane-execution.py
          scripts/check-app2-lane-execution.py --self-test
          scripts/check-app2-lane-execution.py \
            --label ":shared:core-portfwd:integrationTest" \
            --results-dir shared/core-portfwd/build/test-results/integrationTest \
            --min 5 \
            --newer-than "${RUNNER_TEMP}/portfwd-integration-run-start"

      - name: Upload core-portfwd integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app2-portfwd-integration-reports
          path: |
            shared/core-portfwd/build/reports/tests/
            shared/core-portfwd/build/test-results/
          overwrite: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # app2 — Robolectric-backed host-JVM unit tests (the nav graph runs as a real
  # composition). Debug only: the module's tests are Robolectric/Compose tests
  # with no variant-specific behaviour, and neither build type minifies.
  app2-unit:
    name: app2 unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.app2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Mark test-run start
        run: touch "${RUNNER_TEMP}/app2-run-start"

      - name: Run app2 unit tests
        id: app2_tests
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew :app2:testDebugUnitTest \
            --rerun-tasks --no-build-cache \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee "${RUNNER_TEMP}/app2-gradle.log"

      # 11 when the lane landed, 59 after U-2's connect-flow and trust-prompt
      # suites, 117 after U-4's session ViewModel/screen suites, 424 after
      # U-5's key-byte/geometry/key-bar suites (with U-6, P-3, P-4 and P-6
      # landed alongside); floor 380 — comfortably under the current count but
      # far above the point where a whole suite could silently stop running.
      - name: Assert tests actually executed
        if: always() && steps.app2_tests.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-app2-lane-execution.py
          scripts/check-app2-lane-execution.py --self-test
          scripts/check-app2-lane-execution.py \
            --label ":app2:testDebugUnitTest" \
            --results-dir app2/build/test-results/testDebugUnitTest \
            --min 380 \
            --newer-than "${RUNNER_TEMP}/app2-run-start"

      # Compile-only guard for the instrumented journey (see the header note).
      # Cheap — no emulator, no Docker — and it is the check that would have
      # caught an androidTest break before it reached the emulator lane.
      - name: Compile app2 instrumented tests
        if: always() && steps.app2_tests.conclusion != 'skipped'
        timeout-minutes: 15
        run: |
          set -o pipefail
          ./gradlew :app2:compileDebugAndroidTestKotlin \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Upload app2 test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app2-unit-test-reports
          path: |
            app2/build/reports/tests/
            app2/build/test-results/
          overwrite: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # app2 journey lane (issue #2474) — the emulator lane the header note above
  # promised. app2's 11 instrumented journeys (J01-J08, J10-J12) all passed by
  # hand and NONE of them ran in CI: `app2-unit` only COMPILES the androidTest
  # source set, so any journey regression stayed invisible until a human
  # happened to run scripts/connected-test.sh.
  #
  # ONE JOB, ONE UNFILTERED RUN. No shard matrix and no per-class invocation,
  # deliberately: the whole set runs in a SINGLE instrumentation process, which
  # is the only shape that can see one journey leaking state into the next.
  # That is not hypothetical — running the set together for the first time is
  # exactly what surfaced issue #2477's cross-journey pollution, which a
  # per-class lane would have been green through. scripts/ci-app2-journey-suite.sh
  # owns the invocation and its --self-test (run in the `changes` job above)
  # asserts a class filter can never creep back in.
  #
  # NOT A PER-PR GATE. Emulator + Docker + 11 journeys is ~30-45 min, so it
  # follows the established split (process.md, "Protected `main` checks"): heavy
  # Docker/emulator work batches on push and manual dispatch while PRs keep the
  # cheap required checks. The `github.event_name != 'pull_request'` half of the
  # `if:` below is that decision. The push trigger covers `main` and `stable`
  # (see the `on:` block), and `workflow_dispatch` gives an on-demand run.
  #
  # NO `needs: app2-unit`. tests.yml gates its emulator matrix on a cheap
  # compile job (`dex`) to protect the Actions budget; app2's only equivalent is
  # `app2-unit` itself, up to 25 min, which would nearly double this lane's wall
  # clock. Instead the fast-fail moved INSIDE this job: the APKs are assembled
  # in a normal step BEFORE the emulator boots, so a tree that does not compile
  # reddens without ever spending an AVD, and the in-emulator run starts warm.
  app2-journey:
    name: app2 journey suite (emulator + Docker agents)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.app2 == 'true' }}
    runs-on: ubuntu-latest
    # BUDGET, and why the two step caps below matter more than this one. The
    # 11-journey run measured 15 min locally on a warm build; the assemble step
    # is ~8 min warm and up to ~25 cold; the action's own cold boot is capped at
    # 900 s. The job cap (90) is deliberately LOOSER than the sum of the step
    # caps (30 assemble + 45 journey + ~10 setup), because a job that hits ITS
    # cap is killed by GitHub and uploads NOTHING — the `if: always()` report
    # steps never run and a wedge produces zero evidence. Letting the STEP time
    # out first keeps the artifacts, which is the whole point of the lane.
    timeout-minutes: 90

    steps:
      # fetch-depth 0 (#2381): the APK's versionName derives from the git tag,
      # and scripts/ci-journey-fixture-retry.sh stamps the `agents` fixture with
      # the SAME derivation. A shallow clone makes the APK report the
      # `0.0.0-dev` placeholder while the fixture is stamped from the tag, and a
      # host/client version mismatch is precisely the state journeys must not
      # start from. scripts/check-emulator-apk-version-wiring.sh enforces this
      # on every emulator-booting job.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew + suite script executable
        run: chmod +x ./gradlew scripts/ci-app2-journey-suite.sh

      - name: Verify Docker is available
        run: docker info

      # Assemble BEFORE the emulator boots (see the job header): a compile break
      # fails here in minutes with no AVD spent, and the in-action gradle run
      # then only has to install and instrument.
      - name: Assemble app2 debug + androidTest APKs
        timeout-minutes: 30
        run: |
          set -o pipefail
          ./gradlew :app2:assembleDebug :app2:assembleDebugAndroidTest \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same two hosted-runner failure modes tests.yml
      # hit (#760 disk pressure FATAL-ing the AVD create, #771 the stock
      # sdkmanager crashing so the emulator action's own license accept dies).
      # Reusing the exact scripts keeps this lane's provisioning identical to
      # theirs rather than a second copy that can drift.
      - name: Free disk space for the AVD
        run: scripts/ci-emulator-free-disk.sh

      - name: Initialize journey artifacts
        run: mkdir -p artifacts/app2-journey

      - name: Repair Android cmdline-tools + accept licenses (issue #771)
        run: scripts/ci-emulator-repair-sdk-tools.sh

      - name: Build SSH base image
        run: scripts/ci-journey-fixture-retry.sh sshd -- docker compose -f tests/docker/docker-compose.yml build sshd

      # `agents` on 2222 is what AgentsFixture dials (10.0.2.2:2222 from the
      # emulator) for all 11 journeys.
      - name: Start Docker fixture (agents)
        run: scripts/ci-journey-fixture-retry.sh agents -- docker compose -f tests/docker/docker-compose.yml up -d --build --no-deps agents

      - name: Wait for the agents fixture to report healthy
        run: |
          source tests/docker/lib/wait-for-healthy.sh
          wait_for_container_healthy tests/docker/docker-compose.yml agents /tmp/agents-health.log 60
          cat /tmp/agents-health.log

      # J05ReconnectAfterDropJourney dials the fixture THROUGH this Toxiproxy
      # (2228) and cuts the link over its control API (8474) — see
      # app2/src/androidTest/.../connect/ToxiproxyControl.kt. Started explicitly,
      # and its API polled, so J05 fails loudly on a missing fixture instead of
      # silently degrading. None of the 11 journeys touch the old-CLI (2238),
      # daemon (2239) or packet-loss (2229) fixtures, so those stay down.
      - name: Start Docker fixture (network-fault-proxy)
        run: |
          scripts/ci-journey-fixture-retry.sh network-fault-proxy -- docker compose -f tests/docker/docker-compose.yml up -d --no-deps network-fault-proxy
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8474/version; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f tests/docker/docker-compose.yml logs --no-color network-fault-proxy
          exit 1

      # The execution guard below credits only result XML newer than this
      # marker, so a task that was skipped, UP-TO-DATE or died before running
      # cannot be certified by a previous run's leftovers.
      - name: Mark journey-run start
        run: touch "${RUNNER_TEMP}/app2-journey-run-start"

      - name: Run the full app2 journey suite on the emulator
        id: journey
        # See the job's `timeout-minutes` note: this cap must fire BEFORE the
        # job cap so the report/artifact steps below still run on a wedge.
        timeout-minutes: 45
        # Pinned to the same v2.37.0 commit tests.yml
        # use (#771), so a floating-tag bump cannot silently change SDK-install
        # behaviour under this lane alone.
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          # API 35 / pixel_7 / swiftshader, identical to the other two emulator
          # lanes — one AVD definition to reason about across the repo.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -memory 6144 -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: scripts/ci-app2-journey-suite.sh

      # Issue #2830: the on-call's first question on a red journey run is "the
      # tree or the device?", and run 35435668085's answer — a launcher ANR with
      # `Input dispatching timed out (Application does not have a focused
      # window)` on a runner at load 10.52 — was reachable only by downloading
      # the logcat artifact, while the job itself showed 14 identical
      # product-shaped assertion failures across 8 journeys. This step puts that
      # answer at the TOP of the job summary, before the execution guard below
      # can redden with its own (correct but secondary) complaint.
      #
      # A separate step rather than something the in-emulator script writes
      # directly: `reactivecircus/android-emulator-runner` runs its `script:`
      # inside the emulator wrapper, and a summary that depends on
      # GITHUB_STEP_SUMMARY surviving that wrapper is a summary that can silently
      # stop being written. The script leaves primary-cause.md in the artifact
      # dir; this ordinary step appends it. It never fails the job — a reporting
      # step that reddens would hide the failure it exists to explain.
      - name: Surface the journey's primary cause in the job summary (#2830)
        if: always() && steps.journey.outcome == 'failure'
        run: scripts/ci-app2-journey-suite.sh --report-primary-cause

      # G3: a green `BUILD SUCCESSFUL` proves nothing on its own. 30 tests across
      # the 11 journey classes ran when this lane landed; floor 26 tolerates
      # ordinary churn while a lost class (2-5 tests each) or a vacuous
      # zero-executed run still reddens. `--newer-than` rejects stale XML.
      - name: Assert the journeys actually executed
        if: always() && steps.journey.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-app2-lane-execution.py
          scripts/check-app2-lane-execution.py --self-test
          scripts/check-app2-lane-execution.py \
            --label ":app2:connectedDebugAndroidTest" \
            --results-dir app2/build/outputs/androidTest-results/connected/debug \
            --min 26 \
            --newer-than "${RUNNER_TEMP}/app2-journey-run-start"

      # Issue #2082/#2063: the execution ledger's CONNECTED lane. The old nightly
      # wrapper (ci-nightly-execution-ledger.sh) recorded this for
      # `:app:connectedDebugAndroidTest` across six shards; both it and the suite
      # it served are gone, and without a recorder here the `app2-journey` lane
      # would be a selected set that nothing ever credits — every journey class
      # would read as "never executed" in the rolling ledger.
      #
      # One shard, so plain attendance rather than merge-attendance. The two
      # --require-class pins are the load-bearing journeys the release path
      # depends on; attendance fails closed on an absent results root or an
      # empty XML set, so a suite that silently ran nothing cannot record a
      # green lane.
      #
      # Issue #2744: the recorder above was wired without this restore/save
      # pair, so every `--record` wrote the journey rows into a file that the
      # runner threw away — the ledger is persisted ONLY through the
      # `test-execution-ledger-<os>-` Actions cache chain that tests.yml (unit)
      # and release-emulator-validation.yml (release) share. The result was the
      # exact failure the comment above says the recorder exists to prevent:
      # nothing credited the app2-journey selected set. No other lane can cover
      # for it either — the release gate runs this same suite through raw
      # `adb shell am instrument`, which emits no JUnit XML at all, so its
      # `--record` stages 472 files and credits 0 journey classes. The only
      # journey rows in the live ledger came from one stale `release`-tier
      # record on 2026-09-13, which is why J19-J23 (all added after it) read
      # "NEVER executed" in run 35383053367 while the older 18 were about to
      # age past the 7-day cadence window together.
      #
      # Issue #2785: the save is a SEPARATE `actions/cache/save@v5` step, not
      # the post step of a monolithic `actions/cache@v5`. The monolithic action
      # hard-codes `post-if: "success()"` in its own action.yml, so its save is
      # skipped on exactly the runs whose rows are worth the most: a RED journey
      # job records which classes it did reach and then throws the file away.
      # Its `save-always` input is NOT the fix — v5 still accepts it but marks
      # it deprecated in the same action.yml: "save-always does not work as
      # intended and will be removed in a future release. A separate
      # `actions/cache/restore` step should be used instead."
      # `actions/cache/save@v5` carries no `save-always` input at all, because
      # it does not need one: it is an ordinary main step, so a plain
      # `if: always()` on it is the mechanism.
      #
      # Keyed on the `journey` tier so this lane's entry cannot collide with the
      # unit or release entries while still restoring from the shared prefix.
      # `github.run_id` is in the key for a reason (#2785 item 3): without it,
      # two runs of the SAME sha at attempt 1 — a push run and a later
      # workflow_dispatch run on that commit — compute an identical key, the
      # second run's restore EXACT-hits the first run's entry, and its own save
      # is then rejected as a duplicate key. `actions/cache/save` swallows that
      # into a warning (saveImpl catches every error and calls logWarning), so
      # the run reads green while its rows are silently discarded. The run id
      # makes every key unique per (run, attempt), so no run's rows can be
      # dropped that way. The primary key is then never an exact hit, which is
      # the intended rolling behaviour anyway: restore falls through to the
      # shared prefix and takes the most recently created entry, and `--record`
      # MERGES into that file rather than replacing it, so each save is a
      # superset of the history it restored.
      - name: Restore test-execution ledger (#2082)
        id: ledger_restore
        if: always() && steps.journey.conclusion != 'skipped'
        uses: actions/cache/restore@v5
        with:
          path: build/test-execution-ledger.tsv
          key: test-execution-ledger-${{ runner.os }}-${{ github.sha }}-journey-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-execution-ledger-${{ runner.os }}-

      - name: Record journey execution into the rolling ledger (#2082)
        if: always() && steps.journey.conclusion != 'skipped'
        env:
          LEDGER_RESTORED_KEY: ${{ steps.ledger_restore.outputs.cache-matched-key }}
        run: |
          chmod +x scripts/check-test-execution-ledger.sh
          # Which entry in the shared chain this lane merged into. Without it a
          # "the rows did not persist" report cannot tell a restore that missed
          # apart from a save that was dropped (#2785).
          echo "ledger restore matched key: ${LEDGER_RESTORED_KEY:-<none>}"
          scripts/check-test-execution-ledger.sh \
            --record app2/build/outputs/androidTest-results/connected/debug \
            --tier journey
          scripts/check-test-execution-ledger.sh \
            --attendance \
            --results-root app2/build/outputs/androidTest-results/connected/debug \
            --selected-from app2-journey \
            --require-class com.pocketshell.next.connect.J01ConnectAndTrustJourney \
            --require-class com.pocketshell.next.terminal.J03AttachAndTypeJourney \
            --report

      # `if: always()` here is the entire point of the restore/save split — see
      # the comment above the restore step. The key MUST be byte-identical to
      # the restore step's primary key, or this lane saves outside the chain the
      # next lane's restore-keys prefix reads.
      - name: Save test-execution ledger (#2785)
        if: always() && steps.journey.conclusion != 'skipped'
        uses: actions/cache/save@v5
        with:
          path: build/test-execution-ledger.tsv
          key: test-execution-ledger-${{ runner.os }}-${{ github.sha }}-journey-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p artifacts/docker
          docker compose -f tests/docker/docker-compose.yml ps > artifacts/docker/compose-ps.txt 2>&1 || true
          docker compose -f tests/docker/docker-compose.yml logs --no-color agents > artifacts/docker/agents.log 2>&1 || true
          docker compose -f tests/docker/docker-compose.yml logs --no-color network-fault-proxy > artifacts/docker/network-fault-proxy.log 2>&1 || true

      # The actionable half of a red run: the per-class HTML report says WHICH
      # journey failed, the raw gradle log and logcat say why, and the journey
      # screenshots pulled off the device show what was on screen.
      #
      # Issue #2785: the ledger file ships here too, exactly as the unit lane
      # folds it into `unit-test-reports-<variant>`. The recorded ledger used to
      # be visible only as a cache entry, so answering "what did the record step
      # actually write?" meant downloading the cache and replaying the recorder
      # by hand — which is precisely what the #2744 on-call had to do. It is the
      # post-record file, so it shows this lane's merged result whether or not
      # the save that follows succeeds.
      - name: Upload app2 journey reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app2-journey-reports
          path: |
            app2/build/reports/androidTests/
            app2/build/outputs/androidTest-results/
            app2/build/outputs/connected_android_test_additional_output/
            artifacts/app2-journey/
            artifacts/docker/
            build/test-execution-ledger.tsv
          overwrite: true
          if-no-files-found: ignore

      - name: Stop Docker fixtures
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down --volumes --remove-orphans

  # ---------------------------------------------------------------------------
  # shared/ui-kit connected suite (issue #2826).
  #
  # WHY THIS LANE EXISTS. `UiKitPrimitivesTest` is the ui-kit's only instrumented
  # suite, and until this issue NOTHING in tests.yml or app2.yml EXECUTED it —
  # tests.yml compiles the source set
  # (`:shared:ui-kit:compileDebugAndroidTestKotlin`, still there and still
  # wanted, it is the cheap PR-time link check) and stops. The single lane that
  # ran it was the release gate's pre-release confidence step. That gate had
  # been blocking at the D37 nightly-fault guard BEFORE any test ran, so when
  # #2717's type retune left a stale height oracle behind, the red was invisible
  # for three days and then surfaced as a release blocker. "Compiling proves it
  # links, not that it passes" (docs/ci-pitfalls.md), compounded by a guard that
  # masked the only consumer.
  #
  # SELECTION. Gated on the app2 lane bit, not a new selector output: since
  # issue #2824 `shared/ui-kit/` is an app2 dependency edge, so a ui-kit-only
  # commit already sets it, and shared-infrastructure paths fail it open. That
  # over-selects (an app2-only commit also runs this) and never under-selects,
  # which is the correct error direction for a lane whose entire reason for
  # existing is that it was under-selected to zero.
  #
  # BUDGET. 12 fast component tests, no Docker fixtures, no app2 APK, so the
  # cost is almost entirely the AVD boot this job cannot share with
  # `app2-journey` (the emulator action owns one boot per step). Push/schedule
  # only, the same cadence as `app2-journey`, and the two run in parallel — this
  # adds no wall clock to the run. The step cap is deliberately below the job cap
  # for the same reason app2-journey's is: a job killed at ITS cap uploads
  # nothing.
  ui-kit-connected:
    name: shared/ui-kit connected suite (emulator)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.app2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # fetch-depth 0: scripts/check-emulator-apk-version-wiring.sh requires it
      # of every emulator-booting job — a shallow clone makes the version
      # derivation report the 0.0.0-dev placeholder.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Assemble before the AVD boots, exactly as app2-journey does: a tree that
      # does not compile reddens in minutes without spending an emulator.
      - name: Assemble ui-kit androidTest APKs
        timeout-minutes: 20
        run: |
          ./gradlew :shared:ui-kit:assembleDebugAndroidTest \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same two hosted-runner failure modes every other emulator lane hits
      # (#760 disk pressure, #771 sdkmanager crash), through the same scripts.
      - name: Free disk space for the AVD
        run: scripts/ci-emulator-free-disk.sh

      - name: Repair Android cmdline-tools + accept licenses (issue #771)
        run: scripts/ci-emulator-repair-sdk-tools.sh

      # The execution guard below credits only result XML newer than this
      # marker, so an UP-TO-DATE/FROM-CACHE task or a run that died before
      # instrumenting cannot be certified by a previous run's leftovers.
      - name: Mark ui-kit connected run start
        run: touch "${RUNNER_TEMP}/ui-kit-connected-run-start"

      - name: Run the ui-kit connected suite on the emulator
        id: uikit
        timeout-minutes: 30
        # Same SHA-pinned v2.37.0 commit and same AVD definition as the other
        # emulator lanes (scripts/check-emulator-action-pin.sh).
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -memory 6144 -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          # --rerun-tasks --no-build-cache: the G3 pair. Without them a
          # cache-restored connectedDebugAndroidTest unpacks a previous run's
          # XML with a fresh mtime and real counts, which defeats the guard
          # below and this lane certifies a run that never touched the device.
          # No `tee`, no pipeline: gradle's own rc is the step's rc.
          script: >-
            ./gradlew :shared:ui-kit:connectedDebugAndroidTest
            --rerun-tasks --no-build-cache
            --no-daemon --stacktrace --console=plain
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      # G3 again, from the other side: a green `BUILD SUCCESSFUL` proves
      # nothing. UiKitPrimitivesTest carried 12 tests when this lane landed;
      # floor 10 tolerates ordinary churn while a lost class, an
      # assumeTrue-skipped suite or a vacuous zero-executed run still reddens.
      # `executed = tests - skipped`, and `--newer-than` rejects stale XML.
      - name: Assert the ui-kit connected suite actually executed
        if: always() && steps.uikit.conclusion != 'skipped'
        run: |
          chmod +x scripts/check-app2-lane-execution.py
          scripts/check-app2-lane-execution.py --self-test
          scripts/check-app2-lane-execution.py \
            --label ":shared:ui-kit:connectedDebugAndroidTest" \
            --results-dir shared/ui-kit/build/outputs/androidTest-results/connected/debug \
            --min 10 \
            --newer-than "${RUNNER_TEMP}/ui-kit-connected-run-start"

      - name: Upload ui-kit connected reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-kit-connected-reports
          path: |
            shared/ui-kit/build/reports/androidTests/
            shared/ui-kit/build/outputs/androidTest-results/
            shared/ui-kit/build/outputs/connected_android_test_additional_output/
          overwrite: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Production-binding mutations (issue #1932, rolled up to #1671).
  #
  # Periodic, fail-closed, not a per-PR mutant run. The cheap Unit half
  # (--self-test + --check-sites in tests.yml) only proves the harness can still
  # go red and that every curated target still exists. This job applies one
  # deterministic binding mutant at a time and requires the named
  # production-wired proof to fail. A surviving mutant, a stale/unregistered
  # target, or a truncated/over-budget run is RED.
  #
  # It lived in the deleted nightly-extensive.yml. It moved HERE rather than into
  # tests.yml because this workflow is the one that now carries the periodic
  # cadence (see the `schedule:` trigger above, decision D37) — and it is
  # deliberately schedule/dispatch-only: it is JVM-only, independent of the
  # emulator lane and of the 24h idle guard, so attendance stays visible even on
  # a night when nothing merged. scripts/check-production-binding-mutations.py's
  # own `validate_attendance` pins that this job still invokes `--run`.
  binding-mutations:
    name: Production-binding mutations (issue #1932)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew + harness executable
        run: chmod +x ./gradlew scripts/check-production-binding-mutations.py

      - name: Run curated production-binding mutants
        run: scripts/check-production-binding-mutations.py --run

      - name: Publish binding-mutation summary
        if: always()
        run: |
          if [[ -f artifacts/production-binding-mutations/summary.md ]]; then
            cat artifacts/production-binding-mutations/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Production-binding mutations (#1932 / #1671)"
              echo
              echo "No summary was written (the harness aborted before evidence)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload binding-mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-binding-mutations
          path: artifacts/production-binding-mutations/
          if-no-files-found: error
