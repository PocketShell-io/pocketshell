# The Android gateway emulator lane's fixture (pocketshell#3086 slice 3,
# scripts/connected-js-gateway-docker.sh). Started per run under its own
# compose project; nothing here is reused by any other lane.
#
#   phone (emulator) --wss://localhost:$GWLANE_TLS_PORT (adb reverse)-->
#     tlsfront (TLS, the run's test-CA server cert) --> gateway (the REAL
#     pocketshell-gateway binary, registry + tunnel + broker verification)
#     <== reverse tunnel == agent (the REAL pocketshell-link, enrolled like a
#     user's host) --> 127.0.0.1:22 sshd on `host` (the agents fixture: sshd,
#     the pinned pocketshell CLI and aplexer).
#
# There is NO route from the emulator to the SSH host: `host` publishes no
# port and only the agent (in its network namespace) dials its sshd, exactly
# like a host behind NAT. The only published port is tlsfront's, bound to
# 127.0.0.1 and reached from the emulator through `adb reverse`.
#
# Only two edges are test doubles (tests/docker/gateway/gwfixture): the
# broker's ISSUER (`jwks` serves a throwaway signing key's public half; the
# gateway still runs its full RS256/iss/aud/scope/exp/allowlist checks) and
# the public CA (`tlsfront` presents a server cert from a per-run test CA
# that only the lane's debug build trusts).
#
# Every variable is set by the runner; none has a default, so a fixture
# started by hand without the runner fails instead of guessing.
#
# Base image (durable, no registry): every service reuses the local
# `pocketshell-test:agents` image (debian trixie-slim, sshd + pinned CLI +
# aplexer), which the workflow builds before the emulator starts and which
# the runner rebuilds locally when missing. jwks/gateway/tlsfront only run
# the lane's static Go binaries, so any glibc base works; the agent only
# needs bash/curl, both present in the agents image. `pull_policy: never`
# keeps a missing image a fast fail-closed error instead of a registry
# round-trip.
#
# History: the lane used to share one pinned alpine image from ECR Public.
# 38455239496 failed on ECR "Rate exceeded", daf604e0a added backoff plus a
# Docker Hub digest fallback, then 39569913209 failed on BOTH ("Data limit
# exceeded" on 6 ECR attempts and on the Hub fallback) while the debian-based
# agents build in the same job pulled fine. Pinning a second registry did
# not help; not pulling at all does.
x-gwlane-base: &gwlane-base
  image: pocketshell-test:agents
  pull_policy: never

# Hub intake 8a7a09c7 (AC2): the same test labels the main tests/docker
# compose file stamps on every fixture (see that file for the field-by-field
# rationale). Every service here merges these in - the base-image services via
# a sequence merge with *gwlane-base, `host` directly - so the TTL reaper
# (scripts/docker-test-reaper.sh) can account for the whole lane, not just the
# sshd fixture.
x-test-labels: &test-labels
  labels:
    pocketshell.test: "1"
    agent.session: ${POCKETSHELL_TEST_SESSION:-unknown}
    pocketshell.test.created: ${POCKETSHELL_TEST_CREATED_AT:-}

services:
  jwks:
    <<: [*gwlane-base, *test-labels]
    entrypoint: ["/gw/gwfixture", "jwks", "-key", "/broker/broker-key.pem", "-listen", ":8088"]
    volumes:
      - ${GWLANE_BIN:?}:/gw:ro
      - ${GWLANE_STATE:?}/broker:/broker:ro

  gateway:
    <<: [*gwlane-base, *test-labels]
    entrypoint: ["/gw/gateway"]
    command:
      - "-listen"
      - ":8080"
      - "-registry"
      - "/var/lib/pocketshell-relay/registry.json"
      # The broker credential's iss claim the gateway requires; nothing is
      # fetched from it. Keys come from -broker-jwks.
      - "-broker-issuer"
      - "http://broker:8088"
      - "-broker-jwks"
      - "http://jwks:8088/gateway/jwks"
      - "-broker-audience"
      - "pocketshell-gateway"
      # Plain-http JWKS on the fixture network only (the gateway refuses it
      # next to a public domain); signature verification is never skipped.
      - "-broker-allow-insecure-dev"
      - "-allow"
      - "${GWLANE_EMAIL:?}"
    volumes:
      - ${GWLANE_BIN:?}:/gw:ro
      - gateway-registry:/var/lib/pocketshell-relay
    depends_on:
      - jwks

  tlsfront:
    <<: [*gwlane-base, *test-labels]
    entrypoint: ["/gw/gwfixture", "tlsfront", "-cert", "/tls/server.pem", "-key", "/tls/server.key", "-listen", ":8443", "-upstream", "gateway:8080"]
    ports:
      - "127.0.0.1:${GWLANE_TLS_PORT:?}:8443"
    volumes:
      - ${GWLANE_BIN:?}:/gw:ro
      - ${GWLANE_STATE:?}/tls:/tls:ro
    depends_on:
      - gateway

  host:
    <<: *test-labels
    image: pocketshell-test:agents
    pull_policy: never
    environment:
      POCKETSHELL_AGENT_FIXTURE_VERSION: ${POCKETSHELL_AGENT_FIXTURE_VERSION:-}
    # VERBOSE: sshd logs every connection the agent bridges ("Connection
    # from"), so the runner can prove a pin mismatch reached sshd and still
    # made zero userauth attempts. The image's own entrypoint then runs.
    entrypoint: ["/bin/sh", "-c", "printf '\\nLogLevel VERBOSE\\n' >> /etc/ssh/sshd_config && exec /usr/local/bin/pocketshell-agent-entrypoint"]

  agent:
    <<: [*gwlane-base, *test-labels]
    # Production topology: the agent reaches ITS OWN sshd on loopback.
    network_mode: "service:host"
    entrypoint: ["/bin/bash", "/gwlane/agent-entrypoint.sh"]
    environment:
      DEVICE_ID: ${GWLANE_DEVICE_ID:?}
    volumes:
      - ${GWLANE_BIN:?}:/gw:ro
      - ${GWLANE_STATE:?}/enroll:/enroll:ro
      - ./agent-entrypoint.sh:/gwlane/agent-entrypoint.sh:ro
      - agent-state:/agent-state
    depends_on:
      - gateway
      - host

volumes:
  gateway-registry:
  agent-state:
