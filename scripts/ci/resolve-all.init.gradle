// Init script: registers :app:resolveAndroidDeps, which downloads every debug
// and debugAndroidTest compile/runtime artifact (incl. androidTest-only ones
// such as org.hamcrest:hamcrest-library) so the Gradle cache holds them.
allprojects {
    afterEvaluate { p ->
        if (p.path == ':app') {
            p.tasks.register('resolveAndroidDeps') {
                doLast {
                    p.configurations.matching {
                        it.canBeResolved && it.name ==~ /debug(AndroidTest)?(Compile|Runtime)Classpath/
                    }.each { c ->
                        println "resolving ${c.name}: ${c.files.size()} files"
                    }
                }
            }
        }
    }
}
