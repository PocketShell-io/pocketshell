<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="PocketShell JS-first Android rewrite preview" />
    <title>PocketShell</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d1117; color: #e6edf3; font: 15px system-ui, sans-serif; }
      /* Invisible on a normal start (the app replaces it within ~0.5 s); pure CSS so it still
         reveals when no script ever runs. Shown only after 5 s without a mount (#3141). */
      @keyframes boot-fallback-reveal { to { visibility: visible; } }
      .boot-fallback { visibility: hidden; animation: boot-fallback-reveal 0s linear 5s forwards; margin: 24px; padding: 16px; border: 1px solid #f85149; border-radius: 10px; color: #ffb4ab; background: #211518; }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot-fallback" role="alert">PocketShell shell assets did not start. Rebuild and reinstall this debug APK.</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
